<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <!-- Elegant golden gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D780" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="65%" stop-color="#A57C00" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <!-- Soft shadow for depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Deep dark luxury background -->
  <rect width="120" height="120" rx="30" fill="#1A1A1A" />
  
  <!-- Subtle inner border -->
  <rect x="4" y="4" width="112" height="112" rx="26" fill="none" stroke="url(#goldGradient)" stroke-width="1.5" opacity="0.4" />

  <!-- The elegant 'M' symbol -->
  <g filter="url(#shadow)">
    <!-- A small crown motif above the M -->
    <path d="M 52 18 L 56 22 L 60 16 L 64 22 L 68 18 L 66 24 L 54 24 Z" fill="url(#goldGradient)" />

    <!-- Royal Serif 'M' -->
    <path d="M 26 31 C 26 29 28 28 30 28 L 40 28 C 42 28 44 29 44 31 L 44 34 L 41 34 L 41 85 L 45 85 L 45 89 L 25 89 L 25 85 L 29 85 L 29 34 L 26 34 Z" fill="url(#goldGradient)" />
    <path d="M 76 31 C 76 29 78 28 80 28 L 90 28 C 92 28 94 29 94 31 L 94 34 L 91 34 L 91 85 L 95 85 L 95 89 L 75 89 L 75 85 L 79 85 L 79 34 L 76 34 Z" fill="url(#goldGradient)" />
    <!-- Central apex and chevron of M -->
    <path d="M 38 34 L 60 74 L 82 34 L 87 37 L 62 82 C 61 83.5 59 83.5 58 82 L 33 37 Z" fill="url(#goldGradient)" />
  </g>
</svg>